# Add inside the existing server { } block for jarvis.farviewequity.com
# (the same one that serves /orbit), then: sudo nginx -t && sudo systemctl reload nginx

location ^~ /prism/mcp/ {
    proxy_pass http://127.0.0.1:8041/mcp/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location ^~ /prism/ {
    proxy_pass http://127.0.0.1:8040;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    client_max_body_size 20m;   # crawler log uploads
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
}
